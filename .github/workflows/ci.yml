name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Type errors in .astro/.ts/.tsx, plus broken content-collection frontmatter.
      - run: pnpm check

      # Trace generators must agree with the algorithms they claim to visualise.
      - run: pnpm test

      # A page marked `complete` must actually carry the full spine — in
      # particular "When NOT to use it" and "Failure modes", which are the
      # entire reason this site exists.
      - run: pnpm lint:spine

      - run: pnpm lint

  # Separate job: it needs a browser download and takes minutes rather than
  # seconds, so keeping it out of `check` preserves fast time-to-red on the
  # cheap failures.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # The only layer that exercises hydration. Unit and jsdom tests mount
      # components by hand, so they cannot see an island that renders correct
      # HTML and then dies the moment React attaches — which is exactly the
      # failure that made every quiz on the site inert while 212 tests passed.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
