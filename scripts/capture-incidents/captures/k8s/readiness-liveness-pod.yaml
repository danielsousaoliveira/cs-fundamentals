apiVersion: v1
kind: Pod
metadata:
  name: readiness-demo
spec:
  containers:
    - name: web
      image: nginx:alpine
      readinessProbe:
        httpGet: { path: /, port: 80 }
        initialDelaySeconds: 3
        periodSeconds: 5
      livenessProbe:
        httpGet: { path: /, port: 80 }
        initialDelaySeconds: 5
        periodSeconds: 10
